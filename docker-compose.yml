services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kick_yayin
      POSTGRES_USER: kick_user
      POSTGRES_PASSWORD: guclu_sifre
    ports:
      - "5432:5432"
    volumes:
      - kick_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kick_user -d kick_yayin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kick_postgres_data:
