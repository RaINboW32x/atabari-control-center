<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATABARI Control Center — Yeni Şifre</title><link rel="stylesheet" href="/app.css"></head><body><div class="login-wrap"><section class="login-hero"><img src="/logo.png" style="width:90px"><h1 style="font-size:54px;max-width:650px">Hesabınızı güvenle kurtarın.</h1><p class="muted">Bağlantınız 30 dakika geçerlidir ve yalnızca bir kez kullanılabilir.</p></section><section class="login-card"><form id="resetForm" class="login-box stack"><div><h2>Yeni şifre belirle</h2><p class="muted">En az 8 karakterden oluşan yeni şifrenizi girin.</p></div><div class="field"><label>Yeni şifre</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>Yeni şifre tekrar</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn primary">Şifreyi güncelle</button><p class="muted" id="message"></p><a class="forgot-link" href="/">Giriş ekranına dön</a></form></section></div><script>const token=new URLSearchParams(location.search).get('token'),msg=document.getElementById('message'),form=document.getElementById('resetForm');if(!token){msg.textContent='Sıfırlama bağlantısı geçersiz.';form.querySelector('button').disabled=true}form.onsubmit=async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value,btn=form.querySelector('button');if(a!==b){msg.textContent='Şifreler eşleşmiyor.';return}btn.disabled=true;btn.textContent='Güncelleniyor...';try{const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:a})}),d=await r.json();if(!r.ok)throw new Error(d.error||'İşlem başarısız');msg.textContent=d.message;setTimeout(()=>location.href='/',1800)}catch(x){msg.textContent=x.message;btn.disabled=false;btn.textContent='Şifreyi güncelle'}};</script></body></html>
