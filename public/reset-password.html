<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATABARI Şifre Sıfırlama</title><link rel="stylesheet" href="/app.css"></head><body><div class="wrap"><header class="top"><a class="brand" href="/"><img src="/logo.png"><div><h1>ATABARI</h1><small>Güvenli şifre yenileme</small></div></a></header><section class="card login"><h2>Yeni şifre belirle</h2><p class="muted">Yeni şifreniz en az 8 karakter olmalıdır.</p><form id="resetForm"><label>Yeni şifre</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required><br><br><label>Yeni şifre tekrar</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><br><br><button class="btn primary" style="width:100%">Şifreyi Yenile</button><div class="muted" id="message" style="margin-top:12px"></div></form><a class="btn" style="width:100%;margin-top:10px" href="/admin">Giriş ekranına dön</a></section></div><script>const token=new URLSearchParams(location.search).get('token');const msg=document.getElementById('message');if(!token)msg.textContent='Sıfırlama bağlantısı geçersiz.';document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b){msg.textContent='Şifreler eşleşmiyor.';return}msg.textContent='İşleniyor...';try{const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:a})});const d=await r.json();if(!r.ok)throw new Error(d.error||'İşlem başarısız');msg.textContent=d.message;setTimeout(()=>location.href='/admin',1800)}catch(x){msg.textContent=x.message}};</script></body></html>
