<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yayıncı Profili · ATABARI</title><link rel="stylesheet" href="/app.css"></head><body><div class="wrap"><header class="top"><a class="brand" href="/"><img src="/logo.png"><div><h1>ATABARI Yayın Ekibi</h1></div></a><nav class="nav"><a class="btn" href="/yayincilar">Tüm Yayıncılar</a></nav></header><div id="root"></div></div><script>const e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(d+'T00:00:00')),lab={planned:'Planlandı',live:'Canlı',done:'Tamamlandı',cancelled:'İptal'};let slug=location.pathname.split('/').filter(Boolean).pop();fetch('/api/public/streamers/'+slug).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error);return d}).then(d=>{let s=d.streamer,up=d.broadcasts.filter(b=>new Date(`${b.date}T${b.end}:00`)>=new Date()).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));document.title=s.name+' · ATABARI';root.innerHTML=`<section class="card profile-hero">${s.avatarUrl?`<img class="avatar big" src="${e(s.avatarUrl)}">`:`<div class="avatar big">${e(s.name.slice(0,2))}</div>`}<div><span class="badge">ATABARI YAYINCISI</span><h2>${e(s.name)}</h2><div class="muted">${s.kickUsername?'@'+e(s.kickUsername):''}</div><p>${e(s.bio||'Biyografi eklenmemiş.')}</p><div class="socials">${s.kickUrl?`<a class="btn primary" target="_blank" href="${e(s.kickUrl)}">Kick Kanalı</a>`:''}${Object.entries(s.socials||{}).filter(x=>x[1]).map(([k,v])=>`<a class="btn" target="_blank" href="${e(v)}">${e(k)}</a>`).join('')}</div></div></section><section class="card section"><h3>Yayın Programı</h3><div class="tablewrap"><table><thead><tr><th>Tarih</th><th>Saat</th><th>Program</th><th>Durum</th></tr></thead><tbody>${up.length?up.map(b=>`<tr><td>${fmt(b.date)}</td><td>${b.start}–${b.end}</td><td>${e(b.title)}</td><td><span class="status ${b.status}">${lab[b.status]}</span></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Yaklaşan yayın bulunmuyor.</td></tr>'}</tbody></table></div></section>`}).catch(x=>root.innerHTML=`<div class="card empty">${e(x.message)}</div>`)</script></body></html>
