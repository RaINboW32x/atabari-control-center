<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yayıncılar · ATABARI</title><link rel="stylesheet" href="/app.css"></head><body><div class="wrap"><header class="top"><a class="brand" href="/"><img src="/logo.png"><div><h1>ATABARI Yayıncıları</h1><small>Ekibimizi tanıyın</small></div></a><nav class="nav"><a class="btn" href="/">Yayın Takvimi</a></nav></header><div class="profiles" id="profiles"></div></div><script>const e=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/public').then(r=>r.json()).then(d=>{profiles.innerHTML=d.streamers.length?d.streamers.map(s=>`<a class="card profile-card" href="/yayinci/${s.slug}"><div class="profile-cover"></div>${s.avatarUrl?`<img class="profile-avatar" src="${e(s.avatarUrl)}">`:`<div class="profile-avatar"></div>`}<h3>${e(s.name)}</h3><div class="muted">${s.kickUsername?'@'+e(s.kickUsername):'ATABARI Yayıncısı'}</div><p>${e(s.bio||'Profil bilgileri yakında eklenecek.')}</p><span class="btn primary">Profili Gör</span></a>`).join(''):'<div class="card empty">Henüz yayıncı eklenmedi.</div>'})</script></body></html>
