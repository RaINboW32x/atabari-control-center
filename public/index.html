<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATABARI Yayın Ekibi</title><meta name="description" content="ATABARI Yayın Ekibi canlı yayın programı ve yayıncı profilleri."><link rel="stylesheet" href="/app.css"></head><body><header class="public-header"><div class="brand" style="padding:0"><img src="/logo.png"><span><strong>ATABARI</strong><small>Canlı Yayın Merkezi</small></span></div><nav class="row"><a class="btn" href="/">Ana Sayfa</a><a class="btn" href="/yayincilar">Yayıncılar</a></nav></header><main class="public-main"><section class="hero"><span class="badge live">● CANLI YAYIN MERKEZİ</span><h1>Yayınları kaçırma.<br><span style="color:var(--primary)">ATABARI’yi takip et.</span></h1><p class="muted" style="font-size:19px;max-width:680px">Şu an yayında olan yayıncıları, sıradaki programı ve haftalık yayın akışını giriş yapmadan görüntüleyin.</p></section><section id="live" class="card live-card"></section><section style="margin-top:30px"><div class="row between"><h2>Bugünkü program</h2><a href="/yayincilar" class="btn">Tüm yayıncılar</a></div><div id="schedule" class="grid three"></div></section><section style="margin-top:50px"><h2>Yayıncılarımız</h2><div id="streamers" class="grid three"></div></section></main><script>
fetch('/api/public').then(r=>r.json()).then(d=>{let now=new Date(),today=now.toISOString().slice(0,10),mins=now.getHours()*60+now.getMinutes();let bs=d.broadcasts||[],live=bs.find(x=>x.date===today&&x.status==='live')||bs.find(x=>x.date===today&&(+x.start.slice(0,2)*60+ +x.start.slice(3,5))<=mins&&(+x.end.slice(0,2)*60+ +x.end.slice(3,5))>mins);document.querySelector('#live').innerHTML=live?`<div class="row between"><div><span class="badge live">● ŞU AN YAYINDA</span><h2 style="font-size:34px;margin-bottom:8px">${live.streamer}</h2><p class="muted">${live.start}–${live.end} · ${live.title}</p></div><a class="btn primary" href="${live.url||'#'}" target="_blank">Kick’te İzle →</a></div>`:`<div><h2>Şu anda planlı canlı yayın yok</h2><p class="muted">Sıradaki yayınlar aşağıda.</p></div>`;let day=bs.filter(x=>x.date===today);document.querySelector('#schedule').innerHTML=day.map(x=>`<article class="card"><span class="muted">${x.start}–${x.end}</span><h3>${x.streamer}</h3><p>${x.title}</p>${x.url?`<a class="btn small" href="${x.url}" target="_blank">Yayına git</a>`:''}</article>`).join('')||'<div class="card muted">Bugün için program eklenmemiş.</div>';document.querySelector('#streamers').innerHTML=(d.streamers||[]).slice(0,9).map(s=>`<a href="/yayinci/${s.slug}" class="card" style="color:inherit;text-decoration:none"><div class="row"><img class="avatar" src="${s.avatarUrl||'/logo.png'}"><div><h3 style="margin:0">${s.name}</h3><span class="muted">@${s.kickUsername||s.slug}</span></div></div><p class="muted">${s.bio||'ATABARI yayıncısı'}</p></a>`).join('')});
</script></body></html>
